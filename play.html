<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Charge-Pandy - Play</title>
<meta name="description" content="Charge-Pandy - a rhythm-based Charge / Shield / Boom duel game.">
<meta name="theme-color" content="#06060F">
<link rel="icon" type="image/png" href="assets/app_icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800&family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('cp_theme')||'dark')}catch(e){}</script>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/martial.css">
<script>try{if(sessionStorage.getItem('cp_swipe')==='1')document.documentElement.classList.add('fx-entering')}catch(e){}</script>
</head>
<body data-page="play">
<div class="shell">
  <main class="main">
    <div class="wrap">

      <!-- ===== select screen ===== -->
      <section id="selectView">
        <header class="page-head">
          <div class="eyebrow">Select screen</div>
          <h1>Choose your Pandy</h1>
        </header>
        <div class="select-layout">
          <div class="pick-grid" id="pickGrid"></div>
          <aside class="loadout">
            <div class="preview cut lg pad" id="preview"></div>
            <div class="color-row cut alt" id="colorRow"></div>
            <div class="cpu-card cut alt" id="cpuCard"></div>
            <button class="btn" id="btnConfirm" disabled data-keepfocus>Confirm &amp; Fight <span class="kbd">Enter</span></button>
            <a class="btn ghost slim" id="btnBack" href="index.html">Back <span class="kbd">Esc</span></a>
          </aside>
        </div>
      </section>

      <!-- ===== duel ===== -->
      <section id="duelView" hidden>
        <div class="stage cut lg">
          <div class="inner" id="stageInner">
            <div class="hud">
              <div class="side p">
                <div class="name" id="pName">- select fighter -</div>
                <div class="lives" id="pLives"></div>
                <div class="charges p" id="pCharges"></div>
              </div>
              <div class="mid">
                <div class="score" id="scoreLine">ROUND 1 &middot; YOU 0 &ndash; 0 CPU</div>
                <div class="vs">VS</div>
                <div class="beat"><span class="dot" id="dot1"></span><span class="dot" id="dot2"></span><span class="word" id="beatWord">READY</span></div>
              </div>
              <div class="side cpu">
                <div class="name" id="cName">- CPU -</div>
                <div class="lives" id="cLives"></div>
                <div class="charges c" id="cCharges"></div>
              </div>
            </div>
            <div class="sprite p" id="spriteP"><img id="imgP" alt="" src=""></div>
            <div class="sprite c" id="spriteC"><img id="imgC" alt="" src=""></div>
            <div class="ult-flash" id="ultFlash"></div>
          </div>
        </div>
        <div class="feed" id="feed"></div>
        <div class="dock" id="dock"></div>
        <div class="duel-actions">
          <button class="btn ghost slim" id="btnChange" data-keepfocus>Change Fighter <span class="kbd">F</span></button>
          <button class="btn ghost slim" id="btnRestart" data-keepfocus>Restart Match <span class="kbd">Ctrl+R</span></button>
          <a class="btn ghost slim orange" id="btnQuit" href="index.html">Quit Match <span class="kbd">Esc</span></a>
        </div>
      </section>

    </div>
  </main>
</div>

<script src="js/seed.js"></script>
<script src="js/sound.js"></script>
<script src="js/store.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
<script src="js/martial.js"></script>
<script src="js/play.js"></script>
</body>
</html>
